services:
  # =============================================================================
  # PHP 8.3-FPM + Supervisor Application Container
  # =============================================================================
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    image: digimag-app:production
    container_name: digimag_app
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-مجلة الفنون والسينما}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-https://magazine.gacta.ly}"
      LOG_CHANNEL: "${LOG_CHANNEL:-daily}"
      LOG_LEVEL: "${LOG_LEVEL:-error}"

      # Database Configuration
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: db
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-digi_mag}"
      DB_USERNAME: "${DB_USERNAME:-digi_mag_user}"
      DB_PASSWORD: "${DB_PASSWORD:-SecretDbPass123!}"

      # Redis Cache & Queue
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-SecretRedisPass123!}"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      # Filesystem & Storage
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-public}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-us-east-1}"
      AWS_BUCKET: "${AWS_BUCKET:-}"
      AWS_ENDPOINT: "${AWS_ENDPOINT:-}"
      AWS_USE_PATH_STYLE_ENDPOINT: "${AWS_USE_PATH_STYLE_ENDPOINT:-false}"
    volumes:
      - app_storage:/var/www/html/storage
      - public_assets:/var/www/html/public
    networks:
      - digimag_internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php /var/www/html/artisan about || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # =============================================================================
  # Nginx Reverse Proxy Container
  # =============================================================================
  web:
    image: nginx:1.25-alpine
    container_name: digimag_web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public_assets:/var/www/html/public:ro
      - app_storage:/var/www/html/storage:ro
      - nginx_cache:/var/cache/nginx/fastcgi
    networks:
      - digimag_internal
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # =============================================================================
  # MySQL 8.0 Database Container
  # =============================================================================
  db:
    image: mysql:8.0
    container_name: digimag_db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=200
      - --innodb_buffer_pool_size=512M
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-RootDbPass123!}"
      MYSQL_DATABASE: "${DB_DATABASE:-digi_mag}"
      MYSQL_USER: "${DB_USERNAME:-digi_mag_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-SecretDbPass123!}"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - digimag_internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER -p$$MYSQL_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =============================================================================
  # Redis 7 Alpine Container (Cache, Session, & Queue)
  # =============================================================================
  redis:
    image: redis:7-alpine
    container_name: digimag_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-SecretRedisPass123!}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - digimag_internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-SecretRedisPass123!} ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

# =============================================================================
# Persistent Storage Volumes
# =============================================================================
volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local
  public_assets:
    driver: local
  nginx_cache:
    driver: local

# =============================================================================
# Isolated Internal Network
# =============================================================================
networks:
  digimag_internal:
    driver: bridge
