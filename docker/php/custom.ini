[PHP]
; -----------------------------------------------------------------------------
; PHP Production Configuration - General Authority of Cinema, Theatre & Arts
; -----------------------------------------------------------------------------

; Resource Limits
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; File Uploads (Optimized for high-resolution magazine PDFs, media, and archive assets)
file_uploads = On
upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 50

; Security Hardening
expose_php = Off
allow_url_fopen = On
allow_url_include = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_multi_exec,parse_ini_file,show_source
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

; Error Handling & Logging
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
error_log = /proc/self/fd/2

; Timezone & Character Set
date.timezone = UTC
default_charset = "UTF-8"

; Zend OPcache Production Settings
[opcache]
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.max_wasted_percentage = 10
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1
opcache.enable_file_override = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M
