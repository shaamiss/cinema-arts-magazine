[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info

; -----------------------------------------------------------------------------
; PHP-FPM Service (FastCGI Server)
; -----------------------------------------------------------------------------
[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=unexpected
exitcodes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

; -----------------------------------------------------------------------------
; Background Queue Workers: media-processing & default
; Handles ProcessPdfPagesJob, OptimizeMediaImageJob, and background tasks
; -----------------------------------------------------------------------------
[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --queue=media-processing,default --tries=3 --timeout=300 --memory=512 --sleep=3
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
priority=20

; -----------------------------------------------------------------------------
; Scheduled Task Worker (Automates scheduled publication, metrics & pruning)
; -----------------------------------------------------------------------------
[program:laravel-schedule]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/schedule.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
priority=30
